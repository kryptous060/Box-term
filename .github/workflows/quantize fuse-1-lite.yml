name: Convert and Quantize Fuse-1-Lite-v2 to IQ4_XS GGUF

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      quant_type:
        description: 'Quantization type (e.g., IQ4_XS, IQ4_NL, Q4_K_S)'
        required: false
        type: string
        default: 'IQ4_XS'

jobs:
  convert-and-quantize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch transformers accelerate safetensors huggingface_hub

      - name: Build llama-quantize Tool
        run: |
          git clone https://github.com/ggerganov/llama.cpp
          cd llama.cpp
          cmake -B build
          cmake --build build --config Release --target llama-quantize -j$(nproc)
          sudo cp build/bin/llama-quantize /usr/local/bin/

      - name: Clone Custom GGUF Converter Repository
        run: |
          if [ ! -d "fuse3_gguf_repo" ]; then
            git clone https://huggingface.co/Akahsizrr/fuse-1-Lite-GGUF fuse3_gguf_repo
          fi

      - name: Download Model and Architecture Definition
        run: |
          python3 -c "
          import os
          import urllib.request
          from huggingface_hub import snapshot_download

          model_dir = '/mnt/workspace/fuse-1-Lite-v2'
          os.makedirs(model_dir, exist_ok=True)

          print('Downloading Fuse-1-Lite-v2 weights...')
          snapshot_download(repo_id='auryn-macmillan/fuse-1-Lite-v2', local_dir=model_dir)

          arch_code_path = os.path.join(model_dir, 'fuse3_model_v2.py')
          if not os.path.exists(arch_code_path):
              print('Downloading custom architecture definition...')
              url = 'https://huggingface.co/auryn-macmillan/fuse-1-Lite-v2/raw/main/fuse3_model_v2.py'
              urllib.request.urlretrieve(url, arch_code_path)
          "

      - name: Convert to F16 GGUF
        run: |
          python3 -c "
          import os
          import sys
          import subprocess

          model_dir = '/mnt/workspace/fuse-1-Lite-v2'
          gguf_f16 = '/mnt/workspace/fuse-1-Lite-v2-F16.gguf'

          converter_script = 'fuse3_gguf_repo/conversion/fuse3.py'
          if not os.path.exists(converter_script):
              converter_script = 'fuse3_gguf_repo/fuse3.py'

          convert_cmd = [
              sys.executable,
              converter_script,
              model_dir,
              '--outtype', 'f16',
              '--outfile', gguf_f16
          ]

          print('Executing initial F16 GGUF conversion...')
          result = subprocess.run(convert_cmd)
          if result.returncode != 0:
              sys.exit(result.returncode)
          "

      - name: Quantize to IQ4_XS GGUF
        env:
          QUANT_TYPE: ${{ inputs.quant_type || 'IQ4_XS' }}
        run: |
          QUANT="${QUANT_TYPE:-IQ4_XS}"
          INPUT_F16="/mnt/workspace/fuse-1-Lite-v2-F16.gguf"
          OUTPUT_QUANT="/mnt/workspace/fuse-1-Lite-v2-${QUANT}.gguf"

          echo "[INFO] Quantizing ${INPUT_F16} to ${QUANT}..."
          llama-quantize "${INPUT_F16}" "${OUTPUT_QUANT}" "${QUANT}"

          echo "Quantization finished: ${OUTPUT_QUANT}"
          rm -f "${INPUT_F16}"

      - name: Upload Quantized GGUF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fuse-1-Lite-v2-IQ4_XS-GGUF
          path: /mnt/workspace/fuse-1-Lite-v2-*.gguf
          if-no-files-found: error
