name: Heretic Abliterate & Quantize fuse-1-Lite-v2

on:
  workflow_dispatch:

jobs:
  quantize:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Runner Disk Space & Set 8GB Swap
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 512
          swap-size-mb: 8192      # 8GB swap + 7GB RAM = 15GB total virtual RAM
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Free Pre-installed Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/swift
          df -h

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential git python3-pip

      - name: Install CPU-Only Python Dependencies
        run: |
          pip3 install --no-cache-dir torch --extra-index-url https://download.pytorch.org/whl/cpu
          pip3 install --no-cache-dir transformers huggingface_hub sentencepiece heretic-llm

      - name: Build llama.cpp (llama-quantize)
        run: |
          git clone https://github.com/ggerganov/llama.cpp.git
          cd llama.cpp
          cmake -B build -DGGML_NATIVE=OFF
          cmake --build build --config Release --target llama-quantize -j$(nproc)

      - name: Download Safetensors
        run: |
          python3 -c "
          from huggingface_hub import snapshot_download
          snapshot_download(repo_id='auryn-macmillan/fuse-1-Lite-v2', local_dir='./fuse-1-lite-v2-src')
          "

      - name: Run Heretic Abliteration
        run: |
          heretic --model ./fuse-1-lite-v2-src --output ./fuse-1-lite-v2-heretic
          rm -rf ./fuse-1-lite-v2-src    # Delete raw source files immediately

      - name: Convert HF Safetensors to F16 GGUF
        run: |
          python3 llama.cpp/convert_hf_to_gguf.py ./fuse-1-lite-v2-heretic --outtype f16 --outfile fuse-1-Lite-v2-Heretic-F16.gguf
          rm -rf ./fuse-1-lite-v2-heretic  # Delete PyTorch weights immediately

      - name: Quantize to IQ4_NL
        run: |
          ./llama.cpp/build/bin/llama-quantize fuse-1-Lite-v2-Heretic-F16.gguf fuse-1-Lite-v2-Heretic-IQ4_NL.gguf IQ4_NL
          rm -f fuse-1-Lite-v2-Heretic-F16.gguf # Delete intermediate F16 GGUF immediately

      - name: Upload IQ4_NL to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gguf-quants
          files: fuse-1-Lite-v2-Heretic-IQ4_NL.gguf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
