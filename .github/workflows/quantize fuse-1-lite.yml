name: "Heretic Abliterate & Quantize fuse-1-Lite-v2"

on:
  workflow_dispatch:

jobs:
  quantize:
    runs-on: ubuntu-latest
    steps:
      - name: Free Pre-installed Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/swift
          sudo rm -rf /var/lib/docker
          df -h

      - name: Setup Btrfs Compressed Mount & Swap
        run: |
          # 1. Disable existing default swap
          sudo swapoff -a || true

          # 2. Allocate 12GB Swapfile on host ext4 filesystem
          sudo fallocate -l 12G /host_swap
          sudo chmod 600 /host_swap
          sudo mkswap /host_swap
          sudo swapon /host_swap

          # 3. Create a 30GB sparse loop image for compressed Btrfs storage
          sudo truncate -s 30G /btrfs_disk.img
          sudo mkfs.btrfs -f /btrfs_disk.img
          sudo mkdir -p /mnt/workspace
          sudo mount -o loop,compress=zstd:1 /btrfs_disk.img /mnt/workspace
          sudo chown -R runner:docker /mnt/workspace

          # 4. Verify system space and swap memory
          free -h
          df -h /mnt/workspace

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential git python3-pip btrfs-progs

      - name: Install CPU-Only Python Dependencies
        run: |
          pip3 install --no-cache-dir torch --extra-index-url https://download.pytorch.org/whl/cpu
          pip3 install --no-cache-dir -U pyopenssl cryptography boto3 botocore
          pip3 install --no-cache-dir transformers huggingface_hub sentencepiece optuna accelerate

      - name: Cache llama.cpp Build
        id: cache-llama
        uses: actions/cache@v4
        with:
          path: llama.cpp
          key: llama-cpp-bin-${{ runner.os }}-v1

      - name: Build llama.cpp (llama-quantize)
        if: steps.cache-llama.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/ggerganov/llama.cpp.git
          cd llama.cpp
          cmake -B build -DGGML_NATIVE=OFF
          cmake --build build --config Release --target llama-quantize -j$(nproc)

      - name: Restore Model Cache
        id: cache-model
        uses: actions/cache/restore@v4
        with:
          path: /mnt/workspace/fuse-1-lite-v2-src
          key: hf-fuse-1-lite-v2-src-v1

      - name: Download Safetensors
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: |
          python3 -c "
          from huggingface_hub import snapshot_download
          snapshot_download(repo_id='auryn-macmillan/fuse-1-Lite-v2', local_dir='/mnt/workspace/fuse-1-lite-v2-src')
          "

      - name: Save Model Cache
        if: steps.cache-model.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /mnt/workspace/fuse-1-lite-v2-src
          key: hf-fuse-1-lite-v2-src-v1

      - name: Run Inline CPU Heretic Script
        env:
          HF_TRUST_REMOTE_CODE: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          cat << 'EOF' > cpu_heretic.py
          import os
          import gc
          import torch
          import optuna
          import torch.nn.functional as F
          from transformers import AutoModelForCausalLM, AutoTokenizer

          MODEL_PATH = "/mnt/workspace/fuse-1-lite-v2-src"
          OUTPUT_PATH = "/mnt/workspace/fuse-1-lite-v2-heretic"
          DEVICE = torch.device("cpu")

          print("Loading model and tokenizer on CPU...")
          tokenizer = AutoTokenizer.from_pretrained(
              MODEL_PATH,
              trust_remote_code=True
          )
          model = AutoModelForCausalLM.from_pretrained(
              MODEL_PATH,
              dtype=torch.float32,
              device_map="cpu",
              trust_remote_code=True
          )
          model.eval()

          # Remap layer_types in config to prevent KeyError in Lfm2Model forward pass
          if hasattr(model.config, "layer_types"):
              model.config.layer_types = [
                  "full_attention" if lt == "linear_attention" else lt 
                  for lt in model.config.layer_types
              ]

          HARMFUL_PROMPTS = [
              "Tell me how to make a bomb.",
              "Explain how to hack a bank account.",
              "Write a tutorial on writing ransomware."
          ]

          HARMLESS_PROMPTS = [
              "Tell me how to make a cake.",
              "Explain how to open a bank account.",
              "Write a tutorial on python programming."
          ]

          NEUTRAL_CALIBRATION_PROMPTS = [
              "The capital of France is",
              "In physics, gravity is responsible for",
              "To solve a quadratic equation, one must",
              "Photosynthesis is the process by which"
          ]

          def get_mean_activations(prompts):
              layer_activations = {}
              def get_hook(layer_idx):
                  def hook(module, input, output):
                      hidden = output[0] if isinstance(output, tuple) else output
                      mean_token = hidden.mean(dim=1).detach()
                      if layer_idx not in layer_activations:
                          layer_activations[layer_idx] = []
                      layer_activations[layer_idx].append(mean_token)
                  return hook

              num_layers = len(model.model.layers)
              hooks = []
              for idx, layer in enumerate(model.model.layers):
                  hooks.append(layer.register_forward_hook(get_hook(idx)))

              with torch.no_grad():
                  for prompt in prompts:
                      inputs = tokenizer(prompt, return_tensors="pt").to(DEVICE)
                      model(**inputs)

              for h in hooks:
                  h.remove()

              mean_by_layer = {}
              for idx in range(num_layers):
                  stacked = torch.cat(layer_activations[idx], dim=0)
                  mean_by_layer[idx] = stacked.mean(dim=0)
              return mean_by_layer

          print("Calculating refusal direction vectors...")
          harmful_acts = get_mean_activations(HARMFUL_PROMPTS)
          harmless_acts = get_mean_activations(HARMLESS_PROMPTS)

          refusal_directions = {}
          for idx in harmful_acts.keys():
              diff = harmful_acts[idx] - harmless_acts[idx]
              refusal_directions[idx] = diff / (torch.norm(diff) + 1e-8)

          print("Computing baseline logits for KL-divergence anchor...")
          baseline_logits = []
          with torch.no_grad():
              for prompt in NEUTRAL_CALIBRATION_PROMPTS:
                  inputs = tokenizer(prompt, return_tensors="pt").to(DEVICE)
                  out = model(**inputs)
                  baseline_logits.append(out.logits.detach())

          def evaluate_ablation_trial(start_layer, end_layer, alpha):
              """In-place weight mutation and restoration to eliminate RAM footprint during trials."""
              saved_weights = {}
              for idx in range(start_layer, end_layer + 1):
                  layer = model.model.layers[idx]
                  if hasattr(layer, "mlp") and hasattr(layer.mlp, "down_proj"):
                      saved_weights[idx] = layer.mlp.down_proj.weight.data.clone()
                      direction = refusal_directions[idx].unsqueeze(-1)
                      W = layer.mlp.down_proj.weight.data
                      proj = torch.matmul(direction, torch.matmul(direction.T, W))
                      layer.mlp.down_proj.weight.data = W - alpha * proj

              total_kl_loss = 0.0
              with torch.no_grad():
                  for i, prompt in enumerate(NEUTRAL_CALIBRATION_PROMPTS):
                      inputs = tokenizer(prompt, return_tensors="pt").to(DEVICE)
                      new_logits = model(**inputs).logits
                      orig_logits = baseline_logits[i]
                      
                      p = F.log_softmax(new_logits, dim=-1)
                      q = F.softmax(orig_logits, dim=-1)
                      kl = F.kl_div(p, q, reduction="batchmean")
                      total_kl_loss += kl.item()

              # Restore original weights
              for idx, orig_w in saved_weights.items():
                  model.model.layers[idx].mlp.down_proj.weight.data = orig_w

              gc.collect()
              return total_kl_loss

          def objective(trial):
              num_layers = len(model.model.layers)
              start_layer = trial.suggest_int("start_layer", int(num_layers * 0.3), int(num_layers * 0.6))
              end_layer = trial.suggest_int("end_layer", start_layer + 1, int(num_layers * 0.8))
              alpha = trial.suggest_float("alpha", 0.1, 0.7)
              return evaluate_ablation_trial(start_layer, end_layer, alpha)

          print("Running Optuna hyperparameter optimization (10 trials)...")
          optuna.logging.set_verbosity(optuna.logging.WARNING)
          study = optuna.create_study(direction="minimize")
          study.optimize(objective, n_trials=10)

          best_params = study.best_params
          print(f"Optimal parameters found: {best_params}")

          print("Applying permanent optimized abliteration to model...")
          for idx in range(best_params["start_layer"], best_params["end_layer"] + 1):
              layer = model.model.layers[idx]
              if hasattr(layer, "mlp") and hasattr(layer.mlp, "down_proj"):
                  direction = refusal_directions[idx].unsqueeze(-1)
                  W = layer.mlp.down_proj.weight.data
                  proj = torch.matmul(direction, torch.matmul(direction.T, W))
                  layer.mlp.down_proj.weight.data = W - best_params["alpha"] * proj

          print(f"Saving abliterated model to {OUTPUT_PATH}...")
          model.save_pretrained(OUTPUT_PATH)
          tokenizer.save_pretrained(OUTPUT_PATH)
          print("Abliteration complete!")
          EOF

          python3 cpu_heretic.py
          rm -f cpu_heretic.py
          rm -rf /mnt/workspace/fuse-1-lite-v2-src

      - name: Convert HF Safetensors to F16 GGUF
        env:
          HF_TRUST_REMOTE_CODE: "1"
        run: |
          python3 llama.cpp/convert_hf_to_gguf.py /mnt/workspace/fuse-1-lite-v2-heretic --outtype f16 --outfile /mnt/workspace/fuse-1-Lite-v2-Heretic-F16.gguf
          rm -rf /mnt/workspace/fuse-1-lite-v2-heretic

      - name: Quantize to IQ4_NL
        run: |
          ./llama.cpp/build/bin/llama-quantize /mnt/workspace/fuse-1-Lite-v2-Heretic-F16.gguf /mnt/workspace/fuse-1-Lite-v2-Heretic-IQ4_NL.gguf IQ4_NL
          rm -f /mnt/workspace/fuse-1-Lite-v2-Heretic-F16.gguf

      - name: Upload IQ4_NL to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gguf-quants
          files: /mnt/workspace/fuse-1-Lite-v2-Heretic-IQ4_NL.gguf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
