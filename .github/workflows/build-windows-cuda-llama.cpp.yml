name: Build Windows CUDA llama-server

on:
  workflow_dispatch:

jobs:
  build-cuda-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: brianchmielNV/llama.cpp
          ref: '98a74c97ea09ac72f6ceda1559808fc0a2f447ce'
          submodules: recursive

      - name: Configure CMake with CUDA (Turing RTX 2070 Max-Q / sm_75)
        run: |
          cmake -S . -B build-win -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES="75" -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_UI=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DBUILD_SHARED_LIBS=OFF

      - name: Build llama-server (Release)
        run: cmake --build build-win --config Release --parallel 4

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-windows-cuda-x64
          path: build-win/bin/Release/llama-server.exe
