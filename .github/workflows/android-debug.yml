name: Build NPU-accelerated SD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sd:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Initialize and update submodules
      run: |
        git submodule update --init --recursive --remote --force
    - name: Set up NDK
      uses: android-actions/setup-android@v3
    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake glslang-tools vulkan-tools libvulkan-dev libshaderc-dev
    - name: Install glslc
      run: |
        sudo apt-get update
        sudo apt-get install -y glslc
    - name: Build stable-diffusion.cpp
      run: |
        # Use the standard ANDROID_NDK_HOME variable
        echo "Using NDK at: ${ANDROID_NDK_HOME}"

        # Safely locate glslc
        if command -v glslc &> /dev/null; then
          GLSLC_PATH=$(which glslc)
          echo "Using glslc at: $GLSLC_PATH"
        else
          echo "glslc not found!"
          exit 1
        fi

        cd src/stable-diffusion.cpp
        echo "Current directory: $(pwd)"
        
        mkdir -p build && cd build
        echo "Running cmake..."
        
        set -x
        cmake .. \
          -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-28 \
          -DSD_VULKAN=ON \
          -DVulkan_GLSLC_EXECUTABLE="${GLSLC_PATH}" \
          -DANDROID=ON \
          -DCMAKE_BUILD_TYPE=Release
        
        echo "CMake completed. Running make..."
        make -j4 sd-cli || { echo "Make failed"; exit 1; }
    - name: Upload SD binary
      uses: actions/upload-artifact@v4
      with:
        name: sd-cli
        path: src/stable-diffusion.cpp/build/bin/sd-cli
