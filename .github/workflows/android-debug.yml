name: Build NPU-accelerated SD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sd:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Initialize and update submodules
      run: |
        git submodule update --init --recursive
        git submodule foreach --recursive 'git fetch origin && (git checkout master || git checkout main || true)'
        git submodule update --init --recursive --remote --force
    - name: Set up NDK
      uses: android-actions/setup-android@v3
    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake glslang-tools vulkan-tools libvulkan-dev libshaderc-dev
    - name: Build stable-diffusion.cpp
      run: |
        # Dynamically find the NDK path
        NDK_PATH=$(ls -d /usr/local/lib/android/sdk/ndk/* | head -n 1)
        echo "Using NDK at: $NDK_PATH"

        # Explicitly locate glslc (provided by glslang-tools)
        GLSLC_PATH=$(which glslc)
        echo "Using glslc at: $GLSLC_PATH"

        cd src/stable-diffusion.cpp
        echo "Current directory: $(pwd)"
        
        mkdir -p build && cd build
        echo "Running cmake..."
        
        set -x
        cmake .. \
          -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake \
          -DCMAKE_PREFIX_PATH=/usr \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-28 \
          -DSD_VULKAN=ON \
          -DVulkan_GLSLC_EXECUTABLE=$GLSLC_PATH \
          -DANDROID=ON > cmake_log.txt 2>&1 || { 
            echo "CMake failed. Output:"
            cat cmake_log.txt
            exit 1 
          }
        
        echo "CMake completed. Running make..."
        
        echo "CMake completed. Running make..."
        make -j4 sd-cli || { echo "Make failed"; exit 1; }
    - name: Upload SD binary
      uses: actions/upload-artifact@v4
      with:
        name: sd-cli
        path: src/stable-diffusion.cpp/build/bin/sd-cli
