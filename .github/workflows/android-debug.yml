name: Build NPU-accelerated SD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-sd:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Set up NDK
      uses: android-actions/setup-android@v3
    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake glslang-tools vulkan-tools libvulkan-dev
    - name: Build stable-diffusion.cpp
      run: |
        # Dynamically find the NDK path
        NDK_PATH=$(ls -d /usr/local/lib/android/sdk/ndk/* | head -n 1)
        echo "Using NDK at: $NDK_PATH"
        
        # Locate Vulkan SDK components
        GLSLC_PATH=$(which glslangValidator)
        echo "Using glslangValidator at: $GLSLC_PATH"
        
        export VULKAN_SDK=/usr
        
        cd src/stable-diffusion.cpp
        mkdir build && cd build
        cmake .. \
          -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-28 \
          -DSD_VULKAN=ON \
          -DVulkan_INCLUDE_DIR=/usr/include/vulkan \
          -DGLSLC_EXECUTABLE=$GLSLC_PATH \
          -DANDROID=ON
        make -j4 sd-cli
    - name: Upload SD binary
      uses: actions/upload-artifact@v4
      with:
        name: sd-cli
        path: src/stable-diffusion.cpp/build/bin/sd-cli
