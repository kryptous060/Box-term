name: Build NPU-accelerated llama.cpp

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-llama-npu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Clone the official llama.cpp repo directly into the GitHub runner workspace
      - name: Clone official llama.cpp
        run: git clone https://github.com/ggml-org/llama.cpp.git

      - name: Build via Snapdragon Toolchain Docker Container
        run: |
          # We map the specific llama.cpp folder into the container's /workspace
          docker run --rm \
            -v ${{ github.workspace }}/llama.cpp:/workspace \
            --platform linux/amd64 \
            ghcr.io/snapdragon-toolchain/arm64-android:v0.7 \
            bash -c "cd /workspace && cp docs/backend/snapdragon/CMakeUserPresets.json . && cmake --preset arm64-android-snapdragon-release -B build-snapdragon && cmake --build build-snapdragon --config Release -j4 && cmake --install build-snapdragon --prefix pkg-snapdragon"

      - name: Upload NPU Binaries & Libraries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-snapdragon
          path: llama.cpp/pkg-snapdra
          gon/
