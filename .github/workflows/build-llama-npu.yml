name: Build NPU-accelerated llama.cpp

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-llama-npu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build via Snapdragon Toolchain Docker Container
        run: |
          docker run --rm \
            --volume $GITHUB_WORKSPACE:/workspace \
            --platform linux/amd64 \
            ghcr.io/snapdragon-toolchain/arm64-android:v0.7 \
            bash --login -s << 'EOF'
              cd /workspace
              cp docs/backend/snapdragon/CMakeUserPresets.json .
              cmake --preset arm64-android-snapdragon-release -B build-snapdragon
              cmake --build build-snapdragon --config Release -j$(nproc)
              cmake --install build-snapdragon --prefix pkg-snapdragon
          EOF

      - name: Upload NPU Binaries & Libraries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-snapdragon
          path: pkg-snapdrag
          on/
