name: Build BitNet Ternary llama.cpp

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: android-arm64
            os: ubuntu-latest
            cmake_args: "-DCMAKE_SYSTEM_NAME=Android -DCMAKE_SYSTEM_VERSION=31 -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a -DGGML_NATIVE=OFF"
            artifact_name: pkg-bitnet-android-arm64
          - target: windows-x64
            os: windows-latest
            cmake_args: "-A x64 -DGGML_NATIVE=ON"
            artifact_name: pkg-bitnet-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Android NDK (Android Target Only)
        if: matrix.target == 'android-arm64'
        uses: nttld/setup-ndk@v3
        with:
          ndk-version: r26c
          add-to-path: true

      - name: Clone Microsoft BitNet
        run: git clone --recursive https://github.com/microsoft/BitNet.git bitnet_src

      - name: Build Binaries
        shell: bash
        run: |
          cd bitnet_src
          cmake -B build ${{ matrix.cmake_args }} -DBUILD_SHARED_LIBS=OFF
          cmake --build build --config Release -j4
          mkdir -p pkg-${{ matrix.target }}
          find build -type f \( -name "llama-cli*" -o -name "llama-server*" -o -name "llama-quantize*" -o -name "*.a" -o -name "*.lib" \) -exec cp {} pkg-${{ matrix.target }}/ \;

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: bitnet_src/pkg-${{ matrix.target }}/
