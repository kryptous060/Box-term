name: Build Windows Vulkan llama-server

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: brianchmielNV/llama.cpp
          ref: '98a74c97ea09ac72f6ceda1559808fc0a2f447ce'
          submodules: recursive

      - name: Install Vulkan SDK
        run: |
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe" -OutFile "vulkan_sdk.exe"
          Start-Process -Wait -FilePath ".\vulkan_sdk.exe" -ArgumentList "/S"

      - name: Configure CMake with Vulkan
        run: |
          cmake -S . -B build-win -G "Visual Studio 17 2022" -A x64 `
            -DGGML_VULKAN=ON `
            -DLLAMA_BUILD_SERVER=ON `
            -DLLAMA_BUILD_UI=OFF `
            -DLLAMA_BUILD_TESTS=OFF `
            -DLLAMA_BUILD_EXAMPLES=OFF `
            -DBUILD_SHARED_LIBS=OFF

      - name: Build llama-server
        run: cmake --build build-win --config Release --parallel 4

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-windows-vulkan-x64
          path: build-win/bin/Release/llama-server.exe
