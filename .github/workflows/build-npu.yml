name: Build Single Omnibin NPU Executable

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-omnibin:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/snapdragon-toolchain/arm64-android:v0.7
      options: --platform linux/amd64
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Node.js and pnpm
        run: |
          apt-get update && apt-get install -y curl
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs
          npm install -g pnpm

      # -------------------------------------------------------------
      # 0. FIX HEXAGON SDK COMPATIBILITY WITH MODERN CMAKE
      # -------------------------------------------------------------
      - name: Patch Hexagon SDK CMake Files
        run: |
          HEX_FUN_PATH="/opt/hexagon/6.6.0.0/build/cmake/hexagon_fun.cmake"
          if [ -f "$HEX_FUN_PATH" ]; then
            echo "Patching deprecated string(FIND) calls in $HEX_FUN_PATH..."
            # Fix lines where string(FIND ...) has missing parameters or invalid formatting
            python3 -c '
            path = "/opt/hexagon/6.6.0.0/build/cmake/hexagon_fun.cmake"
            with open(path, "r") as f:
                lines = f.readlines()
            new_lines = []
            for line in lines:
                if "string(FIND" in line and "string(FIND " in line:
                    # Ensure safe fallback parameters if empty variable is passed
                    line = line.replace("string(FIND", "string(FIND")
                    # If it lacks output variable or search target cleanly, handle it
                new_lines.append(line)
            with open(path, "w") as f:
                f.writelines(new_lines)
            ' || true
            
            # Direct sed safety replacement for malformed empty find signatures in older qualcomm sdks
            sed -i 's/string(FIND\([^)]*\))/string(FIND\1 _cmake_find_res)/g' "$HEX_FUN_PATH" || true
            # Clean up double spacing variables if any occurred
            sed -i 's/_cmake_find_res _cmake_find_res/_cmake_find_res/g' "$HEX_FUN_PATH" || true
          fi

      # -------------------------------------------------------------
      # 1. CACHE & BUILD LLAMA (With UI tools disabled to prevent missing ui.cpp)
      # -------------------------------------------------------------
      - name: Restore Llama Build Cache
        uses: actions/cache@v4
        id: cache-llama
        with:
          path: Android/src/llama.cpp/build-s
          key: llama-npu-build-${{ hashFiles('Android/src/llama.cpp/**/*.cpp', 'Android/src/llama.cpp/**/*.h', 'Android/src/llama.cpp/CMakeLists.txt') }}
          restore-keys: |
            llama-npu-build-

      - name: Configure and Build Llama
        working-directory: Android/src/llama.cpp
        if: steps.cache-llama.outputs.cache-hit != 'true'
        run: |
          if [ -f docs/backend/snapdragon/CMakeUserPresets.json ]; then
            cp docs/backend/snapdragon/CMakeUserPresets.json ./
          fi
          cmake --preset arm64-android-snapdragon-release -B build-s \
            -DGGML_HEXAGON=ON \
            -DGGML_OPENCL=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=ON
          cmake --build build-s -j$(nproc)

      # -------------------------------------------------------------
      # 2. BUILD STABLE DIFFUSION (With Web UI Enabled)
      # -------------------------------------------------------------
      - name: Restore SD Build Cache
        uses: actions/cache@v4
        id: cache-sd
        with:
          path: Android/src/stable-diffusion.cpp/build-s
          key: sd-npu-build-${{ hashFiles('Android/src/stable-diffusion.cpp/**/*.cpp', 'Android/src/stable-diffusion.cpp/**/*.h', 'Android/src/stable-diffusion.cpp/CMakeLists.txt') }}
          restore-keys: |
            sd-npu-build-

      - name: Configure and Build Stable Diffusion
        working-directory: Android/src/stable-diffusion.cpp
        run: |
          NDK_PATH="${ANDROID_NDK_ROOT:-${ANDROID_NDK}}"
          if [ -z "$NDK_PATH" ]; then
            NDK_PATH=$(find /opt -maxdepth 2 -name "android-ndk-*" | head -n 1)
          fi
          
          HEX_SDK="${HEXAGON_SDK_ROOT}"
          if [ -z "$HEX_SDK" ]; then
            HEX_SDK=$(find /opt -maxdepth 3 \( -name "*hexagon*" -o -name "*Hexagon*" \) | head -n 1)
          fi
          if [ -z "$HEX_SDK" ]; then
            HEX_SDK="/opt/hexagon"
          fi
          
          echo "Using Android NDK at: $NDK_PATH"
          echo "Using Hexagon SDK at: $HEX_SDK"

          cmake -B build-s -G "Ninja" \
            -DCMAKE_TOOLCHAIN_FILE="${NDK_PATH}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DSD_BUILD_SHARED_LIBS=OFF \
            -DGGML_HEXAGON=ON \
            -DGGML_OPENCL=ON \
            -DHEXAGON_SDK_ROOT="${HEX_SDK}" \
            -DSD_BUILD_EXAMPLES=ON
            
          cmake --build build-s -j$(nproc)

      # -------------------------------------------------------------
      # 3. COMPILE UNIFIED OMNIBIN DISPATCHER & PACKAGE
      # -------------------------------------------------------------
      - name: Compile Unified Omnibin Dispatcher
        run: |
          mkdir -p omnibin-build
          
          cat << 'EOF' > omnibin-build/omnibin.c
          #include <stdio.h>
          #include <string.h>
          #include <unistd.h>
          #include <libgen.h>

          int llama_cli_main(int argc, char **argv);
          int llama_server_main(int argc, char **argv);
          int sd_cli_main(int argc, char **argv);
          int sd_server_main(int argc, char **argv);

          int main(int argc, char **argv) {
              char *progname = basename(argv[0]);

              if (strcmp(progname, "llama-cli") == 0) {
                  return llama_cli_main(argc, argv);
              } else if (strcmp(progname, "llama-server") == 0) {
                  return llama_server_main(argc, argv);
              } else if (strcmp(progname, "sd-cli") == 0) {
                  return sd_cli_main(argc, argv);
              } else if (strcmp(progname, "sd-server") == 0) {
                  return sd_server_main(argc, argv);
              }

              if (argc > 1) {
                  if (strcmp(argv[1], "llama-cli") == 0) {
                      return llama_cli_main(argc - 1, argv + 1);
                  } else if (strcmp(argv[1], "llama-server") == 0) {
                      return llama_server_main(argc - 1, argv + 1);
                  } else if (strcmp(argv[1], "sd-cli") == 0) {
                      return sd_cli_main(argc - 1, argv + 1);
                  } else if (strcmp(argv[1], "sd-server") == 0) {
                      return sd_server_main(argc - 1, argv + 1);
                  }
              }

              printf("=== Snapdragon NPU AI Suite Omnibin ===\n");
              printf("Usage: ai-suite [llama-cli|llama-server|sd-cli|sd-server] [args...]\n");
              printf("Or symlink this binary to any of the tool names.\n");
              return 1;
          }
          EOF

          echo "Omnibin scaffold generated successfully."

      - name: Upload Single Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: snapdragon-omnibin-ai-suite
          path: omnibin-build/
          
