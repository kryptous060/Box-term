name: Build Four Standalone NPU/Vulkan Binaries (Zero-Lib Clean Root)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-standalone:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/snapdragon-toolchain/arm64-android:v0.7
      options: --platform linux/amd64
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Node.js and pnpm
        run: |
          apt-get update && apt-get install -y curl
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs
          npm install -g pnpm

      # -------------------------------------------------------------
      # 0. SAFE PATCH FOR HEXAGON SDK UNQUOTED VARIABLES
      # -------------------------------------------------------------
      - name: Patch Hexagon SDK CMake Files
        run: |
          HEX_FUN_PATH="/opt/hexagon/6.6.0.0/build/cmake/hexagon_fun.cmake"
          if [ -f "$HEX_FUN_PATH" ]; then
            cat << 'EOF' > patch_sdk.py
          import re
          path = "/opt/hexagon/6.6.0.0/build/cmake/hexagon_fun.cmake"
          with open(path, "r") as f:
              lines = f.readlines()

          new_lines = []
          for line in lines:
              if "string(" in line or "string (" in line:
                  line = re.sub(r'(?<!")(\$\{[A-Za-z0-9_]+\})(?!")', r'"\1"', line)
              new_lines.append(line)

          with open(path, "w") as f:
              f.writelines(new_lines)
          print("Successfully patched hexagon_fun.cmake safely.")
          EOF
            python3 patch_sdk.py
            rm patch_sdk.py
          fi

      # -------------------------------------------------------------
      # 1. BUILD STATIC OPENMP (libomp.a)
      # -------------------------------------------------------------
      - name: Build Static OpenMP Runtime
        run: |
          NDK_PATH="${ANDROID_NDK_ROOT:-${ANDROID_NDK}}"
          if [ -z "$NDK_PATH" ]; then
            NDK_PATH=$(find /opt -maxdepth 2 -name "android-ndk-*" | head -n 1)
          fi

          git clone --depth 1 --filter=blob:none --sparse https://github.com/llvm/llvm-project.git llvm-project-src
          cd llvm-project-src
          git sparse-checkout set runtimes openmp cmake llvm/cmake third-party/unittest
          cd ..

          cmake -B openmp-build -S llvm-project-src/runtimes -G "Ninja" \
            -DCMAKE_TOOLCHAIN_FILE="${NDK_PATH}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_RUNTIMES=openmp \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DOPENMP_INCLUDE_TESTS=OFF \
            -DLIBOMP_ENABLE_SHARED=OFF \
            -DLIBOMP_HAVE_WEAK_ATTRIBUTE=FALSE \
            -DLIBOMP_HAVE_PSAPI=FALSE

          cmake --build openmp-build -j$(nproc)

      # -------------------------------------------------------------
      # 2. BUILD LLAMA.CPP (Retains Hexagon NPU Support)
      # -------------------------------------------------------------
      - name: Configure and Build Llama
        working-directory: Android/src/llama.cpp
        run: |
          if [ -f docs/backend/snapdragon/CMakeUserPresets.json ]; then
            cp docs/backend/snapdragon/CMakeUserPresets.json ./
          fi
          
          HEX_SDK="${HEXAGON_SDK_ROOT:-/opt/hexagon}"
          LIBOMP_PATH=$(find "${GITHUB_WORKSPACE}/openmp-build" -name "libomp.a" | head -n 1)
          
          cmake --preset arm64-android-snapdragon-release -B build-s \
            -DGGML_HEXAGON=ON \
            -DGGML_OPENCL=ON \
            -DHEXAGON_SDK_ROOT="${HEX_SDK}" \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_SERVER=ON \
            -DOpenMP_C_LIB_NAMES=omp \
            -DOpenMP_CXX_LIB_NAMES=omp \
            -DOpenMP_omp_LIBRARY="${LIBOMP_PATH}"
          cmake --build build-s -j$(nproc)

      # -------------------------------------------------------------
      # 3. BUILD STABLE-DIFFUSION.CPP (Switched to Vulkan Backend)
      # -------------------------------------------------------------
      - name: Configure and Build Stable Diffusion
        working-directory: Android/src/stable-diffusion.cpp
        run: |
          NDK_PATH="${ANDROID_NDK_ROOT:-${ANDROID_NDK}}"
          if [ -z "$NDK_PATH" ]; then
            NDK_PATH=$(find /opt -maxdepth 2 -name "android-ndk-*" | head -n 1)
          fi
          
          LIBOMP_PATH=$(find "${GITHUB_WORKSPACE}/openmp-build" -name "libomp.a" | head -n 1)

          cmake -B build-s -G "Ninja" \
            -DCMAKE_TOOLCHAIN_FILE="${NDK_PATH}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DSD_BUILD_SHARED_LIBS=OFF \
            -DSD_VULKAN=ON \
            -DSD_BUILD_EXAMPLES=ON \
            -DOpenMP_C_LIB_NAMES=omp \
            -DOpenMP_CXX_LIB_NAMES=omp \
            -DOpenMP_omp_LIBRARY="${LIBOMP_PATH}"
            
          cmake --build build-s -j$(nproc)

      # -------------------------------------------------------------
      # 4. PACKAGE INTO STANDALONE BINARIES
      # -------------------------------------------------------------
      - name: Package Standalone Binaries
        run: |
          mkdir -p omnibin-build/real_bins

          echo "Finding and copying actual binaries..."
          LLAMA_CLI=$(find Android/src/llama.cpp/build-s -type f \( -name "llama-cli" -o -name "main" \) | head -n 1)
          if [ -n "$LLAMA_CLI" ]; then cp -L "$LLAMA_CLI" omnibin-build/real_bins/llama-cli.real; fi

          LLAMA_SRV=$(find Android/src/llama.cpp/build-s -type f \( -name "llama-server" -o -name "server" \) | head -n 1)
          if [ -n "$LLAMA_SRV" ]; then cp -L "$LLAMA_SRV" omnibin-build/real_bins/llama-server.real; fi

          SD_CLI=$(find Android/src/stable-diffusion.cpp/build-s -type f \( -name "sd" -o -name "sd-cli" -o -name "main" \) | grep -v "server" | head -n 1)
          if [ -n "$SD_CLI" ]; then cp -L "$SD_CLI" omnibin-build/real_bins/sd-cli.real; fi

          SD_SRV=$(find Android/src/stable-diffusion.cpp/build-s -type f -name "sd-server" | head -n 1)
          if [ -n "$SD_SRV" ]; then cp -L "$SD_SRV" omnibin-build/real_bins/sd-server.real; fi

          chmod +x omnibin-build/real_bins/*.real

          echo "Converting Hexagon DSP library to C header..."
          cat << 'EOF' > make_header.py
          import glob, os
          so_files = glob.glob("Android/src/**/libggml-htp*.so", recursive=True)
          if not so_files:
              print("Error: No libggml-htp*.so files found!")
              exit(1)
          target_so = so_files[0]
          filename = os.path.basename(target_so)

          with open(target_so, "rb") as f:
              content = f.read()

          with open("omnibin-build/embedded_libs.h", "w") as out:
              out.write(f'const char* embedded_filename = "{filename}";\n')
              out.write(f'unsigned int embedded_len = {len(content)};\n')
              out.write('unsigned char embedded_htp_so[] = {\n')
              out.write(", ".join(hex(b) for b in content))
              out.write('\n};\n')
          print(f"Embedded {filename} ({len(content)} bytes)")
          EOF
          python3 make_header.py
          rm make_header.py

          echo "Generating Self-Extracting Wrapper Template..."
          cat << 'EOF' > omnibin-build/wrapper.c
          #include <stdio.h>
          #include <string.h>
          #include <unistd.h>
          #include <libgen.h>
          #include <stdlib.h>
          #include <sys/stat.h>
          #include <limits.h>

          #include "embedded_libs.h"

          int main(int argc, char **argv) {
              const char *env_home = getenv("HOME");
              if (!env_home) env_home = "/data/data/com.termux/files/home";

              char cache_dir[PATH_MAX], lib_dir[PATH_MAX], file_path[PATH_MAX];
              snprintf(cache_dir, sizeof(cache_dir), "%s/.ai-suite-cache", env_home);
              snprintf(lib_dir, sizeof(lib_dir), "%s/lib", cache_dir);
              mkdir(cache_dir, 0755);
              mkdir(lib_dir, 0755);

              snprintf(file_path, sizeof(file_path), "%s/%s", lib_dir, embedded_filename);
              if (access(file_path, F_OK) != 0) {
                  FILE *f = fopen(file_path, "wb");
                  if (f) {
                      fwrite(embedded_htp_so, 1, embedded_len, f);
                      fclose(f);
                  }
              }

              char adsp_path[PATH_MAX * 2], ld_path[PATH_MAX * 2];
              snprintf(adsp_path, sizeof(adsp_path), "%s;/vendor/lib64", lib_dir);
              snprintf(ld_path, sizeof(ld_path), "%s:/system/lib64:/vendor/lib64", lib_dir);
              setenv("ADSP_LIBRARY_PATH", adsp_path, 1);
              setenv("LD_LIBRARY_PATH", ld_path, 1);

              char exe_path[PATH_MAX], target_path[PATH_MAX];
              ssize_t len = readlink("/proc/self/exe", exe_path, sizeof(exe_path)-1);
              if (len != -1) {
                  exe_path[len] = '\0';
                  char *dir = dirname(exe_path);
                  snprintf(target_path, sizeof(target_path), "%s/real_bins/%s.real", dir, TARGET_NAME);
                  execv(target_path, argv);
              }
              perror("Failed to launch binary");
              return 1;
          }
          EOF

          NDK_PATH="${ANDROID_NDK_ROOT:-${ANDROID_NDK}}"
          CLANG_BIN=$(find "$NDK_PATH/toolchains/llvm/prebuilt" -name "aarch64-linux-android*-clang" | head -n 1)

          echo "Dynamically compiling wrappers..."
          cd omnibin-build
          for real_file in real_bins/*.real; do
              if [ -f "$real_file" ]; then
                  filename=$(basename "$real_file")
                  target_name="${filename%.real}"
                  echo "Building wrapper for: $target_name"
                  $CLANG_BIN wrapper.c -DTARGET_NAME=\"$target_name\" -o "$target_name" -fPIE -pie
              fi
          done
          
          rm -f wrapper.c embedded_libs.h
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: snapdragon-standalone-binaries
          path: omnibin-build/
          
