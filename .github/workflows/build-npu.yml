name: Build Single Omnibin NPU Executable

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-omnibin:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/snapdragon-toolchain/arm64-android:v0.7
      options: --platform linux/amd64
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Node.js and pnpm
        run: |
          apt-get update && apt-get install -y curl
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs
          npm install -g pnpm

      # -------------------------------------------------------------
      # 0. PATCH HEXAGON SDK FOR MODERN CMAKE COMPATIBILITY
      # -------------------------------------------------------------
      - name: Patch Hexagon SDK CMake Files
        run: |
          python3 -c '
          import re
          path = "/opt/hexagon/6.6.0.0/build/cmake/hexagon_fun.cmake"
          try:
              with open(path, "r") as f:
                  lines = f.readlines()
              new_lines = []
              for line in lines:
                  if "string" in line and "FIND" in line:
                      m = re.search(r"string\s*\(\s*FIND\s+(.+)\)", line, re.IGNORECASE)
                      if m:
                          raw = m.group(1).strip()
                          tokens = [t.strip("\"") for t in raw.split()]
                          if len(tokens) == 2:
                              line = f"  string(FIND \"{tokens[0]}\" \"{tokens[1]}\" _hex_find_res)\n"
                          elif len(tokens) >= 3:
                              line = f"  string(FIND \"{tokens[0]}\" \"{tokens[1]}\" {tokens[-1]})\n"
                  new_lines.append(line)
              with open(path, "w") as f:
                  f.writelines(new_lines)
              print("Successfully patched hexagon_fun.cmake")
          except Exception as e:
              print(f"Skipping patch or file not found: {e}")
          '

      # -------------------------------------------------------------
      # 1. PATCH & BUILD LLAMA.CPP
      # -------------------------------------------------------------
      - name: Patch and Build Llama.cpp
        working-directory: Android/src/llama.cpp
        run: |
          python3 -c '
          import os
          for root, dirs, files in os.walk("."):
              for file in files:
                  if file.endswith((".cpp", ".c", ".cc")):
                      path = os.path.join(root, file)
                      try:
                          with open(path, "r", errors="ignore") as f:
                              content = f.read()
                          if "int main(" in content:
                              if "server" in path.lower():
                                  content = content.replace("int main(", "int llama_server_main(")
                                  content += "\nextern \"C\" int __attribute__((weak)) main(int argc, char** argv) { return 0; }\n"
                              else:
                                  content = content.replace("int main(", "int llama_cli_main(")
                                  content += "\nextern \"C\" int __attribute__((weak)) main(int argc, char** argv) { return 0; }\n"
                              with open(path, "w") as f:
                                  f.write(content)
                              print(f"Patched entrypoint in: {path}")
                      except Exception as e:
                          pass
          '

          if [ -f docs/backend/snapdragon/CMakeUserPresets.json ]; then
            cp docs/backend/snapdragon/CMakeUserPresets.json ./
          fi

          cmake --preset arm64-android-snapdragon-release -B build-s \
            -DGGML_HEXAGON=ON \
            -DGGML_OPENCL=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_SERVER=ON

          cmake --build build-s -j$(nproc)

      # -------------------------------------------------------------
      # 2. PATCH & BUILD STABLE DIFFUSION
      # -------------------------------------------------------------
      - name: Patch and Build Stable Diffusion
        working-directory: Android/src/stable-diffusion.cpp
        run: |
          python3 -c '
          import os
          for root, dirs, files in os.walk("."):
              for file in files:
                  if file.endswith((".cpp", ".c", ".cc")):
                      path = os.path.join(root, file)
                      try:
                          with open(path, "r", errors="ignore") as f:
                              content = f.read()
                          if "int main(" in content:
                              if "server" in path.lower():
                                  content = content.replace("int main(", "int sd_server_main(")
                                  content += "\nextern \"C\" int __attribute__((weak)) main(int argc, char** argv) { return 0; }\n"
                              else:
                                  content = content.replace("int main(", "int sd_cli_main(")
                                  content += "\nextern \"C\" int __attribute__((weak)) main(int argc, char** argv) { return 0; }\n"
                              with open(path, "w") as f:
                                  f.write(content)
                              print(f"Patched entrypoint in: {path}")
                      except Exception as e:
                          pass
          '

          NDK_PATH="${ANDROID_NDK_ROOT:-${ANDROID_NDK}}"
          if [ -z "$NDK_PATH" ]; then
            NDK_PATH=$(find /opt -maxdepth 2 -name "android-ndk-*" | head -n 1)
          fi
          
          HEX_SDK="${HEXAGON_SDK_ROOT}"
          if [ -z "$HEX_SDK" ]; then
            HEX_SDK=$(find /opt -maxdepth 3 \( -name "*hexagon*" -o -name "*Hexagon*" \) | head -n 1)
          fi
          if [ -z "$HEX_SDK" ]; then
            HEX_SDK="/opt/hexagon"
          fi

          cmake -B build-s -G "Ninja" \
            -DCMAKE_TOOLCHAIN_FILE="${NDK_PATH}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DSD_BUILD_SHARED_LIBS=OFF \
            -DGGML_HEXAGON=ON \
            -DGGML_OPENCL=ON \
            -DHEXAGON_SDK_ROOT="${HEX_SDK}" \
            -DSD_BUILD_EXAMPLES=ON
            
          cmake --build build-s -j$(nproc)

      # -------------------------------------------------------------
      # 3. LINK UNIFIED OMNIBIN SUPER BINARY & SYMLINKS
      # -------------------------------------------------------------
      - name: Compile and Link Omnibin Executable
        run: |
          mkdir -p omnibin-build

          # Generating the C++ scaffold safely without Bash EOF/Heredocs
          python3 -c '
          code = """#include <stdio.h>
          #include <string.h>
          #include <unistd.h>
          #include <libgen.h>

          extern "C" {
              int llama_cli_main(int argc, char **argv) __attribute__((weak));
              int llama_server_main(int argc, char **argv) __attribute__((weak));
              int sd_cli_main(int argc, char **argv) __attribute__((weak));
              int sd_server_main(int argc, char **argv) __attribute__((weak));
          }

          int main(int argc, char **argv) {
              char *progname = basename(argv[0]);

              if (strcmp(progname, "llama-cli") == 0 || strcmp(progname, "llama") == 0) {
                  if (llama_cli_main) return llama_cli_main(argc, argv);
                  printf("Error: llama-cli entrypoint not linked.\\n");
                  return 1;
              } else if (strcmp(progname, "llama-server") == 0) {
                  if (llama_server_main) return llama_server_main(argc, argv);
                  printf("Error: llama-server entrypoint not linked.\\n");
                  return 1;
              } else if (strcmp(progname, "sd-cli") == 0 || strcmp(progname, "sd") == 0) {
                  if (sd_cli_main) return sd_cli_main(argc, argv);
                  printf("Error: sd-cli entrypoint not linked.\\n");
                  return 1;
              } else if (strcmp(progname, "sd-server") == 0) {
                  if (sd_server_main) return sd_server_main(argc, argv);
                  printf("Error: sd-server entrypoint not linked.\\n");
                  return 1;
              }

              if (argc > 1) {
                  if (strcmp(argv[1], "llama-cli") == 0 || strcmp(argv[1], "llama") == 0) {
                      if (llama_cli_main) return llama_cli_main(argc - 1, argv + 1);
                  } else if (strcmp(argv[1], "llama-server") == 0) {
                      if (llama_server_main) return llama_server_main(argc - 1, argv + 1);
                  } else if (strcmp(argv[1], "sd-cli") == 0 || strcmp(argv[1], "sd") == 0) {
                      if (sd_cli_main) return sd_cli_main(argc - 1, argv + 1);
                  } else if (strcmp(argv[1], "sd-server") == 0) {
                      if (sd_server_main) return sd_server_main(argc - 1, argv + 1);
                  }
              }

              printf("=== Snapdragon NPU AI Suite Omnibin ===\\n");
              printf("Usage: ai-suite [llama-cli|llama-server|sd-cli|sd-server] [args...]\\n");
              printf("Or symlink this binary to any of the tool names.\\n");
              return 1;
          }
          """
          with open("omnibin-build/omnibin.cpp", "w") as f:
              f.write(code)
          '

          NDK_PATH="${ANDROID_NDK_ROOT:-${ANDROID_NDK}}"
          if [ -z "$NDK_PATH" ]; then
            NDK_PATH=$(find /opt -maxdepth 2 -name "android-ndk-*" | head -n 1)
          fi
          
          CLANGXX=$(find "${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin" -name "aarch64-linux-android*-clang++" | sort -V | tail -n 1)

          ALL_LIBS=$(find Android/src/llama.cpp/build-s Android/src/stable-diffusion.cpp/build-s -name "*.a")
          ALL_OBJS=$(find Android/src/llama.cpp/build-s Android/src/stable-diffusion.cpp/build-s -name "*.o")

          # Note: Changed `-log` to `-llog` to correctly link Android's logging library
          $CLANGXX -O3 -fPIE -pie omnibin-build/omnibin.cpp -Wl,--whole-archive $ALL_LIBS -Wl,--no-whole-archive $ALL_OBJS -o omnibin-build/ai-suite -Wl,--allow-multiple-definition -static-libstdc++ -lm -ldl -lpthread -llog -landroid

          chmod +x omnibin-build/ai-suite

          cd omnibin-build
          ln -sf ai-suite llama-cli
          ln -sf ai-suite llama-server
          ln -sf ai-suite sd-cli
          ln -sf ai-suite sd-server
          cd ..

      - name: Upload Single Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: snapdragon-omnibin-ai-suite
          path: omnibin-build/
          
