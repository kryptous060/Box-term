name: Build Snapdragon NPU/OpenCL Binaries

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-snapdragon:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/snapdragon-toolchain/arm64-android:v0.7
      options: --platform linux/amd64
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Copy CMake User Presets
        run: |
          cp Android/src/llama.cpp/docs/backend/snapdragon/CMakeUserPresets.json Android/src/llama.cpp/

      - name: Configure CMake Preset for Android Hexagon & OpenCL
        working-directory: Android/src/llama.cpp
        run: |
          cmake --preset arm64-android-snapdragon-release -B build-snapdragon \
            -DGGML_HEXAGON=ON \
            -DGGML_OPENCL=ON

      - name: Build All Targets (including HTP DSP binaries)
        working-directory: Android/src/llama.cpp
        run: |
          cmake --build build-snapdragon -j$(nproc)

      - name: Install / Package Binaries
        working-directory: Android/src/llama.cpp
        run: |
          cmake --install build-snapdragon --prefix pkg-snapdragon

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snapdragon-npu-llama-server
          path: Android/src/llama.cpp/pkg-snapdragon/
