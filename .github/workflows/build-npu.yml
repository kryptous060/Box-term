name: Build Single Omnibin NPU Executable

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-omnibin:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android NDK & SDK
        uses: android-actions/setup-android@v3
        
      - name: Cache Build Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            Android/src/llama.cpp/build-s
            Android/src/stable-diffusion.cpp/build-s
          key: ${{ runner.os }}-omnibin-ccache-${{ hashFiles('**/CMakeLists.txt') }}

      # -------------------------------------------------------------
      # 1. SDK PATCHING & OPENMP SETUP
      # -------------------------------------------------------------
      - name: Patch Hexagon SDK & Setup Static OpenMP
        run: |
          echo "Patching Hexagon SDK to handle modern CMake syntax..."
          # [!] NOTE: Insert your specific Hexagon CMake patching scripts here
          
          echo "Configuring LLVM runtimes for static OpenMP (libomp.a)..."
          # [!] NOTE: Insert your specific OpenMP static build scripts here

      # -------------------------------------------------------------
      # 2. COMPILE LLAMA.CPP
      # -------------------------------------------------------------
      - name: Compile llama.cpp (Static + Hexagon DSP)
        run: |
          cd Android/src/llama.cpp
          mkdir -p build-s && cd build-s
          
          # [!] NOTE: Verify these match your specific CMake flags
          cmake .. \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_SYSTEM_VERSION=28 \
            -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a \
            -DGGML_HEXAGON=ON \
            -DGGML_OPENMP=ON \
            -DBUILD_SHARED_LIBS=OFF
            
          make -j$(nproc) llama-cli llama-server

      # -------------------------------------------------------------
      # 3. COMPILE STABLE-DIFFUSION.CPP
      # -------------------------------------------------------------
      - name: Compile stable-diffusion.cpp (Static + Hexagon DSP)
        run: |
          cd Android/src/stable-diffusion.cpp
          mkdir -p build-s && cd build-s
          
          # [!] NOTE: Verify these match your specific CMake flags
          cmake .. \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_SYSTEM_VERSION=28 \
            -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a \
            -DGGML_HEXAGON=ON \
            -DSD_BUILD_SHARED_LIBS=OFF
            
          make -j$(nproc) sd sd-server

      # -------------------------------------------------------------
      # 4. COMPILE UNIFIED OMNIBIN DISPATCHER & PACKAGE (Self-Contained)
      # -------------------------------------------------------------
      - name: Compile Unified Omnibin Dispatcher and Package
        run: |
          mkdir -p omnibin-build/bin
          mkdir -p omnibin-build/lib
          
          echo "Gathering compiled AI binaries..."
          find Android/src/llama.cpp/build-s -type f -executable -name "llama-cli" -exec cp {} omnibin-build/bin/ \;
          find Android/src/llama.cpp/build-s -type f -executable -name "llama-server" -exec cp {} omnibin-build/bin/ \;
          find Android/src/stable-diffusion.cpp/build-s -type f -executable -name "sd" -exec cp {} omnibin-build/bin/sd-cli \;
          find Android/src/stable-diffusion.cpp/build-s -type f -executable -name "sd-server" -exec cp {} omnibin-build/bin/ \;

          echo "Gathering Hexagon DSP Skeleton libraries..."
          find Android/src/llama.cpp/build-s -name "libggml-htp*.so" -exec cp {} omnibin-build/lib/ \;
          find Android/src/stable-diffusion.cpp/build-s -name "libggml-htp*.so" -exec cp -n {} omnibin-build/lib/ \;
          
          echo "Generating BusyBox-style NPU dispatcher..."
          cat << 'EOF' > omnibin-build/dispatcher.c
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>
          #include <libgen.h>

          int main(int argc, char **argv) {
              char *base = basename(argv[0]);
              char exec_path[1024];
              
              if (strcmp(base, "ai-suite") == 0) {
                  if (argc < 2) {
                      printf("Usage: ai-suite [llama-cli|llama-server|sd-cli|sd-server] [args...]\n");
                      return 1;
                  }
                  snprintf(exec_path, sizeof(exec_path), "%s/bin/%s", dirname(argv[0]), argv[1]);
                  execv(exec_path, &argv[1]);
              } else {
                  snprintf(exec_path, sizeof(exec_path), "%s/bin/%s", dirname(argv[0]), base);
                  execv(exec_path, argv);
              }
              
              perror("Execution failed");
              return 1;
          }
          EOF
          
          clang -O2 omnibin-build/dispatcher.c -o omnibin-build/ai-suite
          
          # Setup symlinks
          cd omnibin-build
          ln -s ai-suite llama-cli
          ln -s ai-suite llama-server
          ln -s ai-suite sd-cli
          ln -s ai-suite sd-server
          cd ..

      # -------------------------------------------------------------
      # 5. FRONTEND & ARTIFACT UPLOAD
      # -------------------------------------------------------------
      - name: Build Web Frontend (pnpm)
        run: |
          echo "Building local web dashboard..."
          # [!] NOTE: Insert your pnpm install and build commands here

      - name: Upload AI Suite Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-suite-dist
          path: omnibin-build/
          
