name: Build NPU-accelerated llama.cpp

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-llama-npu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone official llama.cpp
        run: git clone https://github.com/ggml-org/llama.cpp.git

      - name: On-the-fly C++ Patch for DSpark
        run: |
          cd llama.cpp
          # Find the C++ file handling the LFM model architecture
          FILE=$(find src -iname "*lfm*.cpp" | head -n 1)
          
          if [ -n "$FILE" ]; then
            echo "Patching $FILE..."
            # Use sed to inject the missing layer input mapping right after the layer loop starts
            sed -i 's/for (int il = 0; il < n_layer; ++il) {/for (int il = 0; il < n_layer; ++il) {\n        res->t_layer_inp[il] = inpL;/g' "$FILE"
            echo "Patch applied successfully!"
          else
            echo "Could not find the LFM model source file."
            exit 1
          fi

      - name: Build via Snapdragon Toolchain Docker Container
        run: docker run --rm -v ${{ github.workspace }}/llama.cpp:/workspace --platform linux/amd64 ghcr.io/snapdragon-toolchain/arm64-android:v0.7 bash -c "cd /workspace && cp docs/backend/snapdragon/CMakeUserPresets.json . && cmake --preset arm64-android-snapdragon-release -B build-snapdragon && cmake --build build-snapdragon --config Release -j4 && cmake --install build-snapdragon --prefix pkg-snapdragon"

      - name: Upload NPU Binaries & Libraries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-snapdragon
          path: llama.cpp/pkg-snapdragon/
