name: Build Single Omnibin NPU Executable

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-omnibin:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/snapdragon-toolchain/arm64-android:v0.7
      options: --platform linux/amd64
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # -------------------------------------------------------------
      # CACHE LLAMA BUILD (Restores instantly if source hasn't changed)
      # -------------------------------------------------------------
      - name: Restore Llama Build Cache
        uses: actions/cache@v4
        id: cache-llama
        with:
          path: Android/src/llama.cpp/build-s
          key: llama-npu-build-${{ hashFiles('Android/src/llama.cpp/**/*.cpp', 'Android/src/llama.cpp/**/*.h', 'Android/src/llama.cpp/CMakeLists.txt') }}
          restore-keys: |
            llama-npu-build-

      - name: Configure and Build Llama
        working-directory: Android/src/llama.cpp
        if: steps.cache-llama.outputs.cache-hit != 'true'
        run: |
          if [ -f docs/backend/snapdragon/CMakeUserPresets.json ]; then
            cp docs/backend/snapdragon/CMakeUserPresets.json ./
          fi
          cmake --preset arm64-android-snapdragon-release -B build-s \
            -DGGML_HEXAGON=ON \
            -DGGML_OPENCL=ON \
            -DBUILD_SHARED_LIBS=OFF
          cmake --build build-s -j$(nproc)

      # -------------------------------------------------------------
      # CACHE STABLE DIFFUSION BUILD (Saves progress as you tweak it)
      # -------------------------------------------------------------
      - name: Restore SD Build Cache
        uses: actions/cache@v4
        id: cache-sd
        with:
          path: Android/src/stable-diffusion.cpp/build-s
          key: sd-npu-build-${{ hashFiles('Android/src/stable-diffusion.cpp/**/*.cpp', 'Android/src/stable-diffusion.cpp/**/*.h', 'Android/src/stable-diffusion.cpp/CMakeLists.txt') }}
          restore-keys: |
            sd-npu-build-

      - name: Configure and Build Stable Diffusion
        working-directory: Android/src/stable-diffusion.cpp
        run: |
          NDK_PATH="${ANDROID_NDK_ROOT:-${ANDROID_NDK}}"
          if [ -z "$NDK_PATH" ]; then
            NDK_PATH=$(find /opt -maxdepth 2 -name "android-ndk-*" | head -n 1)
          fi
          
          echo "Using Android NDK at: $NDK_PATH"

          cmake -B build-s -G "Ninja" \
            -DCMAKE_TOOLCHAIN_FILE="${NDK_PATH}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DSD_BUILD_SHARED_LIBS=OFF \
            -DGGML_HEXAGON=ON \
            -DGGML_OPENCL=ON
          cmake --build build-s -j$(nproc)

      # 3. Create Dispatcher & Bundle
      - name: Compile Unified Omnibin Dispatcher
        run: |
          mkdir -p omnibin-build
          cat << 'EOF' > omnibin-build/omnibin.c
          #include <stdio.h>
          #include <string.h>
          #include <unistd.h>
          #include <libgen.h>

          int llama_cli_main(int argc, char **argv);
          int llama_server_main(int argc, char **argv);
          int sd_cli_main(int argc, char **argv);
          int sd_server_main(int argc, char **argv);

          int main(int argc, char **argv) {
              char *progname = basename(argv[0]);
              if (strcmp(progname, "llama-cli") == 0) return llama_cli_main(argc, argv);
              if (strcmp(progname, "llama-server") == 0) return llama_server_main(argc, argv);
              if (strcmp(progname, "sd-cli") == 0) return sd_cli_main(argc, argv);
              if (strcmp(progname, "sd-server") == 0) return sd_server_main(argc, argv);
              
              if (argc > 1) {
                  if (strcmp(argv[1], "llama-cli") == 0) return llama_cli_main(argc - 1, argv + 1);
                  if (strcmp(argv[1], "llama-server") == 0) return llama_server_main(argc - 1, argv + 1);
                  if (strcmp(argv[1], "sd-cli") == 0) return sd_cli_main(argc - 1, argv + 1);
                  if (strcmp(argv[1], "sd-server") == 0) return sd_server_main(argc - 1, argv + 1);
              }
              printf("=== Snapdragon NPU AI Suite Omnibin ===\n");
              return 1;
          }
          EOF
          echo "Omnibin scaffold generated."

      - name: Upload Single Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: snapdragon-omnibin-ai-suite
          path: omnibin-build/
